# Local Postgres for vochi development.
# Port 5434 on the host (5432/5433 are taken by other projects).
#   docker compose up -d      # start
#   docker compose down       # stop (keeps data)
#   docker compose down -v     # stop + wipe data
services:
  db:
    image: postgres:17-alpine
    container_name: vochi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vochi
      POSTGRES_PASSWORD: vochi
      POSTGRES_DB: vochi
    ports:
      - "5434:5432"
    volumes:
      - vochi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vochi -d vochi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vochi_pgdata:
