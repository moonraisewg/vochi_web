name: Update download links

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 0.2.0)"
        required: true
        type: string
      dmg_url:
        required: false
        type: string
      dmg_sha:
        required: false
        type: string
      exe_url:
        required: false
        type: string
      exe_sha:
        required: false
        type: string

# Gap A: the mac-only and windows-only triggers (and CI retries) both push
# branch release/v<version>; serialize them so one never clobbers the other.
concurrency:
  group: releases-pr-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rewrite lib/releases.ts
        env:
          RELEASES_TS: lib/releases.ts
          DMG_URL: ${{ inputs.dmg_url }}
          DMG_SHA: ${{ inputs.dmg_sha }}
          EXE_URL: ${{ inputs.exe_url }}
          EXE_SHA: ${{ inputs.exe_sha }}
        # npx tsx (not pnpm tsx) — matches the proven publish-release.sh invocation.
        run: npx tsx scripts/update-releases.ts
      - name: Open / update the release PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/v${{ inputs.version }}
          base: main
          title: "release: download links for v${{ inputs.version }}"
          commit-message: "release: update download links for v${{ inputs.version }}"
          body: |
            Automated by the app release pipeline. Updates `lib/releases.ts`
            (mac DMG / windows setup.exe url + sha256) for **v${{ inputs.version }}**.

            Merge to publish the new download links on vochi.xyz/download.
          delete-branch: false
